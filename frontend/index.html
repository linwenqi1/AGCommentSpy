<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AGCommentSpy - 评论分析</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="sidebar-header">
      <h1>AGCommentSpy</h1>
      <span class="subtitle">评论分析仪表盘</span>
    </div>
    <div id="app-list"></div>
  </aside>
  <main id="main">
    <header id="header">
      <div id="top-bar">
        <div id="app-title"></div>
      </div>
      <nav id="tabs">
        <button class="tab active" data-tab="overview">概览</button>
        <button class="tab" data-tab="comments">评论</button>
        <button class="tab" data-tab="analysis">分析</button>
        <button class="tab" data-tab="clusters">聚类</button>
      </nav>
    </header>
    <div id="content">
      <div class="loading">选择应用以开始</div>
    </div>
  </main>
</div>
<script src="js/api.js"></script>
<script src="js/charts.js"></script>
<script src="js/app.js"></script>
</body>
</html>
